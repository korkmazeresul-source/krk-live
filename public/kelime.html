<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>En Popüler Cevap</title><style>*{box-sizing:border-box}body{margin:0;background:#081426;color:white;font:700 16px system-ui}main{max-width:540px;margin:auto;padding:12px;min-height:100dvh;display:flex;flex-direction:column;gap:8px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:22px;margin:0}#question{background:#173a66;border:2px solid #70e7ff;border-radius:22px;padding:24px;text-align:center;font-size:clamp(20px,4vw,30px)}#answers{display:grid;gap:8px}.answer{background:#17416a;border:1px solid #70e7ff;padding:13px;border-radius:14px;display:flex;align-items:center;gap:12px;min-height:50px}.open{background:#17654f}.answer small{margin-left:auto;text-align:right}button,input{font:inherit;padding:10px;border:0;border-radius:10px}button{background:#ffe064;color:#142035;cursor:pointer}input{min-width:0;flex:1}#bar{height:6px;background:#52e5ff;transition:width .2s}#rank{font-size:13px;color:#c2d8f2}a{color:#70e7ff} @media(orientation:landscape) and (max-height:550px){main{max-width:900px;min-height:0}#question{padding:12px;font-size:20px}#answers{grid-template-columns:1fr 1fr}.answer{padding:7px;min-height:35px}}</style><main><header><h1>EN POPÜLER CEVAP</h1><span id="status">Bağlanıyor</span><span id="time">60</span></header><div id="bar"></div><div id="question"></div><div id="answers"></div><footer><button id="hint">Harf aç</button><input id="guess" placeholder="Cevabını yaz"><button id="send">Gönder</button></footer><div id="rank"></div><footer><a href="/">Ana ekran</a><button id="full">Tam ekran</button><button id="next">Sonraki</button></footer></main><script>
const questions=[["Yemek güzel de biraz daha ne eklesen iyi olurmuş?",["Karabiber","Tuz","Su","Tereyağı","Salça"]],["Kahvaltıda neler bulunur?",["Peynir","Zeytin","Yumurta","Ekmek","Çay"]],["Bir pikniğe ne götürülür?",["Mangal","Su","Et","Örtü","Ekmek"]],["Kışın ne giyilir?",["Mont","Atkı","Bere","Bot","Eldiven"]],["Evde en çok kullanılan eşyalar?",["Telefon","Koltuk","Televizyon","Buzdolabı","Masa"]],["Bir düğünde ne olur?",["Dans","Pasta","Takı","Müzik","Halay"]],["Okul çantasında ne bulunur?",["Kitap","Defter","Kalem","Silgi","Cetvel"]],["Denize giderken ne alınır?",["Havlu","Mayo","Gözlük","Terlik","Güneş kremi"]],["Mutfakta kullanılan araçlar?",["Bıçak","Tencere","Tava","Kaşık","Çatal"]],["Yağmur yağınca ne kullanılır?",["Şemsiye","Mont","Bot","Yağmurluk","Kapüşon"]]];
const $=id=>document.getElementById(id), norm=s=>String(s).toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i').replace(/[^a-z0-9]/g,'');let q=-1,opened=[],letters=[],deadline=0,ended=false,seen=new Set(),scores={},baseline=true;try{scores=JSON.parse(localStorage.getItem('krk-word-'+new Date().toLocaleDateString('tr-TR')))||{}}catch{}const key='krk-word-'+new Date().toLocaleDateString('tr-TR');function render(){const [prompt,answers]=questions[q];$('question').textContent=prompt;$('answers').replaceChildren();answers.forEach((a,i)=>{const row=document.createElement('div');row.className='answer'+(opened[i]||ended?' open':'');const label=document.createElement('span');label.textContent=(i+1)+'  '+(opened[i]||ended?a:Array.from(a).map((c,j)=>j<letters[i]||c===' '?c:'_').join(' '));row.append(label);const user=document.createElement('small');user.textContent=opened[i]||'';row.append(user);$('answers').append(row)});$('rank').textContent='Günün liderleri: '+Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([u,s])=>u+' '+s+' puan').join(' · ')}
function next(){q=(q+1)%questions.length;opened=Array(5).fill('');letters=Array(5).fill(1);deadline=Date.now()+60000;ended=false;render()}function finish(){if(ended)return;ended=true;deadline=Date.now()+5000;render()}function answer(value,user){if(ended)return;const i=questions[q][1].findIndex((a,i)=>!opened[i]&&norm(a)===norm(value));if(i<0)return;opened[i]=user;scores[user]=(scores[user]||0)+[50,40,30,20,10][i];try{localStorage.setItem(key,JSON.stringify(scores))}catch{}render();if(opened.every(Boolean))finish()}function hint(){if(ended)return;const i=letters.findIndex((n,i)=>!opened[i]&&n<questions[q][1][i].length);if(i>=0){letters[i]++;render()}}function ws(){const socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');socket.onmessage=e=>{try{const s=JSON.parse(e.data).data;if(!s)return;$('status').textContent=s.connected?'CANLI':'Bekleniyor';for(const ev of [...s.events].reverse()){const id=JSON.stringify(ev);if(seen.has(id))continue;seen.add(id);if(baseline)continue;if(ev.type==='chat'){const p=ev.detail.indexOf(': ');if(p>=0)answer(ev.detail.slice(p+2),ev.detail.slice(0,p))}if(ev.type==='gift')hint()}baseline=false;if(seen.size>3000)seen=new Set(s.events.map(e=>JSON.stringify(e)))}catch{}};socket.onclose=()=>{$('status').textContent='Bağlantı kesildi';baseline=true;setTimeout(ws,3000)}}$('hint').onclick=hint;$('next').onclick=next;$('send').onclick=()=>{answer($('guess').value,'Yerel oyuncu');$('guess').value=''};$('guess').onkeydown=e=>{if(e.key==='Enter')$('send').click()};$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{})};next();ws();setInterval(()=>{const t=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('time').textContent=t;$('bar').style.width=(ended?0:t/60*100)+'%';if(!t){if(ended)next();else finish()}},200);</script></html>
